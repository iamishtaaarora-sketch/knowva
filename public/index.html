<!doctype html>
<html lang="en" data-theme="dark"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KNOWVA – Think Beyond. Discover More.</title>
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/animations.css"><link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700&family=Inter:wght@400;500&family=JetBrains+Mono&display=swap" rel="stylesheet">
</head><body>
<svg width="0" height="0" style="position:absolute"><symbol id="logo" viewBox="0 0 40 40"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset=".55" stop-color="#ff5fa8"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs><circle class="ring" cx="20" cy="20" r="17" fill="none" stroke="url(#g)" stroke-width="2" stroke-dasharray="4 5"/><path d="M13 9v22M13 20l14-11M13 20l14 11" stroke="url(#g)" stroke-width="3.2" stroke-linecap="round" fill="none"/><circle cx="27" cy="9" r="2.6" fill="#22d3ee"/><circle cx="27" cy="31" r="2.6" fill="#ff5fa8"/><circle cx="13" cy="20" r="2.6" fill="#7c5cff"/></symbol></svg>
<div class="bg"><i></i><i></i><i></i></div>
<div id="app">
<aside id="side">
  <div class="brand"><svg class="mark"><use href="#logo"/></svg><div><b>KNOWVA</b><small>Think Beyond. Discover More.</small></div></div>
  <button id="new" class="primary">＋ New chat <kbd>Ctrl K</kbd></button>
  <input id="q" class="field" placeholder="Search conversations…" type="search">
  <nav id="list"></nav>
  <div class="foot"><button id="openSet" class="ghost">⚙ Settings</button><div class="me"><span id="avatar">K</span><span id="uname">Guest</span></div></div>
</aside>
<main>
  <header>
    <button id="toggle" class="ghost" title="Toggle sidebar (Ctrl B)">☰</button>
    <div class="modes" id="modes"><button data-m="chat" class="on">💬 Chat</button><button data-m="search">🔎 Search</button><button data-m="code">⌨ Code</button></div>
    <button id="clear" class="ghost" title="Clear conversation">🧹</button>
  </header>
  <section id="chat">
    <div id="welcome">
      <div class="orb big"></div>
      <h1>Hello! I'm <span class="grad">KNOWVA.</span></h1>
      <p>Your ideas deserve intelligent answers.</p>
      <div class="cards">
        <button>🧠 Explain something complicated.</button><button>✍️ Help me write something creative.</button>
        <button>🔎 Research a topic for me.</button><button>💻 Help me code a project.</button>
      </div>
    </div>
    <div id="msgs"></div>
  </section>
  <footer>
    <div id="prov" hidden></div>
    <div id="hint" hidden></div>
    <div class="quick" id="quick"><button>Summarize</button><button>Explain</button><button>Rewrite</button><button>Brainstorm</button><button>Code</button></div>
    <div class="box">
      <button id="attach" class="ghost" title="Attach a text/code file">📎</button><input id="file" type="file" hidden accept=".txt,.md,.js,.ts,.py,.json,.csv,.html,.css,.java,.c,.cpp,.go,.rs,.sql">
      <textarea id="in" rows="1" placeholder="Ask KNOWVA anything…" maxlength="20000"></textarea>
      <button id="x" class="ghost" title="Clear input" hidden>✕</button>
      <button id="web" class="tog" title="Web search">🌐 Search</button>
      <button id="send" title="Send">➤</button>
    </div>
    <small class="note">KNOWVA can make mistakes. Retrieved sources are shown separately from AI-written text.</small>
  </footer>
</main></div>
<div id="modal" hidden><div class="sheet">
  <h3>Settings</h3>
  <label>Your name<input id="sName" class="field" maxlength="30"></label>
  <label>Theme<select id="sTheme" class="field"><option value="dark">Dark</option><option value="light">Light</option><option value="auto">System</option></select></label>
  <label>Accent colour<div id="sAcc" class="sw"></div></label>
  <div class="row"><button id="wipe" class="ghost danger">Delete all chats</button><button id="close" class="primary">Done</button></div>
  <small>Shortcuts: Ctrl+K new chat · / focus input · Ctrl+B sidebar · Esc stop</small>
</div></div>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script type="module" src="js/app.js"></script>
</body></html>
